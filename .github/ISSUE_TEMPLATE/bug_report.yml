name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [plus-efficient, plus-economy, plus-quality, custom]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and expected result
      description: Remove private or proprietary information.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction evidence
      description: Include Codex version, role trace, and validation output when available.
